# ============================================
# 意图行为项目 - 博文分类服务配置文件
# 修改此文件即可调整参数，无需改动代码
# ============================================

# vLLM API 配置
api:
  url: "http://10.1.126.27:8087/v1/chat/completions"
  model: "/data0/yongsheng/rsync/Qwen3.6-35B/Qwen3.6-35B-A3B"
  max_tokens: 512
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  seed: 42
  thinking:
    type: "disabled"
  reasoning:
    effort: "none"
  enable_thinking: false
  timeout: 60
  max_retry: 3
  retry_backoff_base: 2

# 分类配置
classification:
  supported_industries:
    - "汽车"
    - "奶茶"
  default_industry: "汽车"
  pending_level: 0
  other_label: "其他"
  failure_label: "未识别"
  industry_rules:
    汽车:
      layers:
        - "认知层"
        - "兴趣层"
        - "考虑层"
        - "其他"
      level_mapping:
        "认知层": 1
        "兴趣层": 2
        "考虑层": 3
        "其他": 6
      fallback_layer: "其他"
      keyword_map:
        "认知层": ["awareness", "cognition", "认知"]
        "兴趣层": ["interest", "兴趣"]
        "考虑层": ["consideration", "考虑"]
        "其他": ["other", "其他"]
    奶茶:
      layers:
        - "品牌与社交类"
        - "口碑体验类"
        - "消费决策类"
        - "其他"
      level_mapping:
        "品牌与社交类": 1
        "口碑体验类": 2
        "消费决策类": 3
        "其他": 6
      fallback_layer: "其他"
      keyword_map:
        "品牌与社交类": ["brand", "social", "品牌", "社交"]
        "口碑体验类": ["experience", "review", "口碑", "体验"]
        "消费决策类": ["decision", "purchase", "决策", "消费"]
        "其他": ["other", "其他"]

# 提示词配置
prompts:
  industries:
    汽车:
      system_prompt: |
        你是一个汽车行业博文营销分层分类器。请将博文分类到以下4个层级之一。

        可选层级：
        【认知层】— 主打品牌曝光、高传播高热度，让用户认知品牌，容易形成传播趋势。
          典型内容：精美TVC、功能解读类、知识科普类、生活记录情绪共鸣类、话题承接内容、品牌官方宣传片、新车发布会、品牌联名活动。
          特征：以品牌/产品曝光为核心目的，传播性强，但未必包含深度产品信息或购买引导。

        【兴趣层】— 含品牌词，互动率较高，引发讨论、互动，提升用户对产品的兴趣。
          典型内容：KOL对比/评测内容、UGC种草内容、产品功能体验分享、试驾vlog、车型亮点解读、用户讨论帖。
          特征：有具体产品/品牌的信息，能引发用户兴趣和互动讨论，但尚未涉及具体购买决策信息。

        【考虑层】— 产品真实测评、竞品横评对比，价格优惠信息，参数分析，帮助用户完成决策。
          典型内容：优惠促销活动内容、竞品横评对比、价格/落地价讨论、参数配置对比、用户购车决策分享、购车攻略、经销商活动。
          特征：包含帮助用户做出购买决策的具体信息，如价格、优惠、对比、参数、购买渠道等。

        【其他】— 不符合以上三类目标层级的内容，或者内容与汽车营销分层目标无明显关联。

        分类原则：
        1. 优先看博文的核心目的：品牌传播→认知层；引发兴趣→兴趣层；辅助购买→考虑层。
        2. 如果同时涉及多个层级，按最深层级归类。
        3. 如果内容不符合前三类目标，请归为【其他】。
        4. 直接输出分类结果，不要输出分析过程。
        5. 输出格式必须是：最终分类结果：【层级名称】
      user_text_template: |
        请对以下汽车行业博文进行营销分层分类。

        行业：{industry}
        品牌词：{brand_terms}

        博文内容：
        {content}

        请直接输出：最终分类结果：【层级名称】
      user_image_template: |
        请对以下汽车行业图文博文进行营销分层分类。

        行业：{industry}
        品牌词：{brand_terms}

        博文文字内容：
        {content}

        博文配图已附上，请结合文字和图片综合判断。

        请直接输出：最终分类结果：【层级名称】
      user_video_template: |
        请对以下汽车行业视频博文进行营销分层分类。

        行业：{industry}
        品牌词：{brand_terms}

        博文文字内容：
        {content}

        视频关键帧已附上，请结合文字和画面综合判断。

        请直接输出：最终分类结果：【层级名称】
    奶茶:
      system_prompt: |
        你是一个奶茶行业博文营销分层分类器。请将博文分类到以下4个层级之一。

        可选层级：
        【品牌与社交类】— 承接用户“为什么愿意发、为什么愿意转、为什么跟着讨论”的内容表达。
          核心是传播动力——明星效应、热度事件、情绪认同、联名话题。

        【口碑体验类】— 承接用户“真实体验如何、排队值不值、什么场景适合喝”的内容表达。
          核心是消费后的真实感受和场景关联。

        【消费决策类】— 承接用户“值不值得买、怎么点最好、有没有优惠”的内容表达。
          核心是产品吸引力和购买动机，是离转化最近的内容。

        【其他】— 不符合以上三类目标层级的内容，或者内容与奶茶营销分层目标无明显关联。

        分类原则：
        1. 优先判断内容的核心目的：传播扩散→品牌与社交类；体验评价→口碑体验类；购买动机→消费决策类。
        2. 如果同时涉及多个层级，按最深层级归类。
        3. 如果内容不符合前三类目标，请归为【其他】。
        4. 直接输出分类结果，不要输出分析过程。
        5. 输出格式必须是：最终分类结果：【层级名称】
      user_text_template: |
        请对以下奶茶行业博文进行营销分层分类。

        行业：{industry}
        品牌词：{brand_terms}

        博文内容：
        {content}

        请直接输出：最终分类结果：【层级名称】
      user_image_template: |
        请对以下奶茶行业图文博文进行营销分层分类。

        行业：{industry}
        品牌词：{brand_terms}

        博文文字内容：
        {content}

        博文配图已附上，请结合文字和图片综合判断。

        请直接输出：最终分类结果：【层级名称】
      user_video_template: |
        请对以下奶茶行业视频博文进行营销分层分类。

        行业：{industry}
        品牌词：{brand_terms}

        博文文字内容：
        {content}

        视频关键帧已附上，请结合文字和画面综合判断。

        请直接输出：最终分类结果：【层级名称】
  forward_review_prompt: |
    请先判断以下“转发博文”是否存在异常传播情况。

    行业：{industry}
    品牌词：{brand_terms}

    转发博文内容：
    {content}

    原博文内容：
    {forward_content}

    需要重点判断是否存在：
    1. 非理智表达
    2. 拉踩
    3. 抹黑
    4. 与原博文信息明显不一致

    输出要求：
    - 如果存在上述异常情况，输出：转发判定：【异常】
    - 如果不存在上述异常情况，输出：转发判定：【正常】

# 图片媒体配置
media:
  image:
    url_pattern: "https://wx2.sinaimg.cn/mw690/{pid}.jpg"
    download_timeout: 30
    max_images_per_request: 3
  video:
    hive_table: "ods_ad_sfst_media_info"
    showbatch_api: "http://i.iotep.tools.biz.weibo.com/api/v1/video/media/showBatch"
    default_customer_id: "2608812381"
    extract_frames_count: 3
    download_timeout: 120
    enabled: true
    # 视频处理策略：始终优先 frame（抽帧），frame 失败自动降级 cover（封面图）
    # 此配置仅作为文档参考，实际策略由 classifier.py 控制（优先 frame）
    video_mode: "frame"

